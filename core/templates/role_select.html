<!DOCTYPE html>
<html>

<head>
    <title>Select Role - Smart Tutoring System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --bg-secondary: #1e293b;
            --bg-elevated: #334155;
            --border-color: #334155;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .select-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 36px 40px;
            text-align: center;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        h2 {
            color: #ffffff;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn-role {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--primary-glow);
            display: inline-block;
        }

        .btn-role:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.45);
            transform: translateY(-2px);
            color: #ffffff;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="select-card">
        <h2>👋 Welcome! Are you here to learn or teach?</h2>
        <div class="btn-group">
            <a href="/learners/" class="btn-role">🎓 I am a Learner</a>
            <a href="/tutors/" class="btn-role">👨‍🏫 I am a Tutor</a>
        </div>
    </div>
</body>

</html>
