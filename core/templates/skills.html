<!DOCTYPE html>
<html>

<head>
    <title>Skills</title>
</head>

<body>
    <h2>Skills List</h2>
    <a href="{% url 'home' %}">← Back to Home</a><br><br>
    <table border="1" cellpadding="6">
        <tr>
            <th>ID</th>
            <th>Skill Name</th>
            <th>Category</th>
        </tr>
        {% for sk in skills %}
        <tr>
            <td>{{ sk.skill_id }}</td>
            <td>{{ sk.skill_name }}</td>
            <td>{{ sk.category }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No skills found.</td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
