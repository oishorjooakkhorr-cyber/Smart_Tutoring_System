<!DOCTYPE html>
<html>

<head>
    <title>Bookings</title>
</head>

<body>
    <h2>Bookings List</h2>
    <a href="{% url 'home' %}">← Back to Home</a><br><br>
    <table border="1" cellpadding="6">
        <tr>
            <th>Booking ID</th>
            <th>Learner</th>
            <th>Tutor</th>
            <th>Slot No</th>
            <th>Date</th>
            <th>Status</th>
        </tr>
        {% for b in bookings %}
        <tr>
            <td>{{ b.booking_id }}</td>
            <td>{{ b.learner.student.name }}</td>
            <td>{{ b.tutor.student.name }}</td>
            <td>{{ b.slot.slot_no }}</td>
            <td>{{ b.date }}</td>
            <td>{{ b.status }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6">No bookings found.</td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
